input:
  lq_dir: C:/Users/kumi/Desktop/SR_HR_IMG/LR
  hr_dir: C:/Users/kumi/Desktop/SR_HR_IMG/HR
  exts: [".png", ".jpg", ".jpeg", ".webp"]

output:
  out_dir: D:/repository/sam3-mask/output/SR_HR_by_label
  save_crop: false
  save_cutout: false
  save_mask: false
  save_overlay: false

prompts:
  labels: [face]
  label_mode: single
  score_threshold: 0.25

pairing:
  expected_scale: 2.0
  scale_tolerance: 0.05
  skip_scale_mismatch: true

pipeline:
  stage: crop

crop:
  hr_crop_size: 480

model:
  backend: sam3
  proposal_provider: none
  checkpoint: D:/repository/sam3-mask/sam3.pt
  device: cuda:0
